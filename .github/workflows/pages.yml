name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 首次部署时自动启用 Pages（Source = GitHub Actions）。
          # 不加这个，这一步会因为「Pages 尚未启用」直接失败（实测过）。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # 只发布 web/：纯静态，无后端
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
